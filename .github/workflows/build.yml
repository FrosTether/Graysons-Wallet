name: Build

# Every push to main that touches the app or the chain runs the chain tests, then builds the app
# and frostnode and refreshes the release for the current version (v<versionName>), so
#   https://github.com/FrosTether/Graysons-Wallet/releases/latest/download/GraysonsWallet.apk
# always serves the newest build. A push that only changes frostnode goes through node.yml
# instead, which swaps in a new frostnode.zip and leaves the app alone.
#
# Signing: with the SIGNING_* repository secrets set (see BUILDING.md), the app is signed with
# the release key. Without them it's signed with a throwaway test key, and the release says so.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'core/**'
      - 'gradle/**'
      - '*.gradle'
      - 'gradlew'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

# Shares a queue with node.yml. A newer build replaces whatever is running, since it publishes
# both the app and frostnode.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-core:
    name: Chain core tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run the tests
        run: ./gradlew --no-daemon :core:test

  build:
    name: App and frostnode
    needs: test-core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Use the release key, if the repository has one
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          echo "VERSION=$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" app/build.gradle)" >> "$GITHUB_ENV"
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            printf '%s' "$SIGNING_KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "BUILD_KIND=release" >> "$GITHUB_ENV"
          else
            echo "BUILD_KIND=test" >> "$GITHUB_ENV"
          fi
      - name: Build the app
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ "$BUILD_KIND" = release ]; then
            ./gradlew --no-daemon :app:assembleRelease
          else
            ./gradlew --no-daemon :app:assembleRelease -PtestSigning
          fi
      - name: Build frostnode
        run: ./gradlew --no-daemon :node:distZip
      - name: Collect the files
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/GraysonsWallet.apk
          cp node/build/distributions/*.zip out/frostnode.zip
          cd out && sha256sum * | tee SHA256SUMS
          { echo "### Graysons Wallet $VERSION ($BUILD_KIND key)"; echo '```'; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: graysons-wallet-${{ env.VERSION }}-${{ env.BUILD_KIND }}
          path: out/*
      - name: Publish the release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$BUILD_KIND" = release ]; then
            TITLE="Graysons Wallet $VERSION"
            KEY_NOTE="Signed with the Graysons Wallet release key. Later versions install over it as normal updates."
          else
            TITLE="Graysons Wallet $VERSION (test key)"
            KEY_NOTE="**Test key.** This build is signed with a temporary test key. When the release key arrives, you'll uninstall once more and restore with your 25 words."
          fi
          { cat .github/release-notes.md; echo; echo "$KEY_NOTE"; } > "$RUNNER_TEMP/notes.md"
          gh release delete "v$VERSION-test" --yes --cleanup-tag || true
          gh release delete "v$VERSION" --yes --cleanup-tag || true
          gh release create "v$VERSION" out/* --latest --target "$GITHUB_SHA" \
            --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md"
      - name: Point the old 0.3.0 download link at this build
        # The first finux.tech pages linked releases/GraysonsWallet-0.3.0-poc.apk straight from main. That build runs
        # a dead chain, so the file there is always the newest app. The original is kept in releases/0.3.0/.
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin main
          git checkout -q -B main origin/main
          cp out/GraysonsWallet.apk releases/GraysonsWallet-0.3.0-poc.apk
          if git diff --quiet -- releases/GraysonsWallet-0.3.0-poc.apk; then exit 0; fi
          git add releases/GraysonsWallet-0.3.0-poc.apk
          git commit -q -m "Old 0.3.0 download link now gets $VERSION [skip ci]"
          git push -q origin main
