name: Build

# Every push to main runs the chain tests, builds the app and frostnode, and refreshes the
# "v0.4.0-test" pre-release with the files. Builds are debug-signed until a release key is
# added as repository secrets (see BUILDING.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-core:
    name: Chain core tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run the tests
        run: ./gradlew --no-daemon :core:test

  build:
    name: App and frostnode
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build the app (test build, debug-signed)
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Build frostnode
        run: ./gradlew --no-daemon :node:distZip
      - name: Collect the files
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/GraysonsWallet-0.4.0-test.apk
          cp node/build/distributions/*.zip out/frostnode-0.4.0.zip
          cd out && sha256sum * | tee SHA256SUMS
          { echo '### Files'; echo '```'; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: graysons-wallet-0.4.0-test
          path: out/*
      - name: Publish the test pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.4.0-test --yes --cleanup-tag || true
          gh release create v0.4.0-test out/* --prerelease --target "$GITHUB_SHA" \
            --title "Graysons Wallet 0.4.0 (test build)" \
            --notes-file .github/test-release-notes.md
