name: frostnode

# A push that only changes frostnode (the server node and FrostExplorer) rebuilds frostnode.zip,
# checks that FrostExplorer answers, and swaps the zip into the current release (v<versionName>).
# The app and its checksum stay exactly as they were, so phones don't need a reinstall.
# A push that also changes the app or the chain goes through the Build workflow, which publishes both.

on:
  push:
    branches: [main]
    paths:
      - 'node/**'
      - '.github/workflows/node.yml'
  workflow_dispatch:

permissions:
  contents: write

# Shares a queue with the Build workflow, so the two never write the release at the same time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frostnode:
    name: frostnode and FrostExplorer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build frostnode
        run: ./gradlew --no-daemon :node:installDist :node:distZip
      - name: Check that FrostExplorer answers
        run: |
          node/build/install/frostnode/bin/frostnode --data "$RUNNER_TEMP/data" --port 17830 --explorer-port 17831 > "$RUNNER_TEMP/node.log" 2>&1 &
          NODE_PID=$!
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:17831/api/explorer/status -o "$RUNNER_TEMP/status.json" 2>/dev/null && break
            sleep 1
          done
          cat "$RUNNER_TEMP/node.log"
          cat "$RUNNER_TEMP/status.json"; echo
          grep -q '"height"' "$RUNNER_TEMP/status.json"
          curl -fsS http://127.0.0.1:17831/ -o "$RUNNER_TEMP/page.html"
          grep -q 'FrostExplorer' "$RUNNER_TEMP/page.html"
          curl -fsS "http://127.0.0.1:17831/api/explorer/blocks?count=5" -o "$RUNNER_TEMP/blocks.json"
          grep -q '^\[' "$RUNNER_TEMP/blocks.json"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:17831/api/explorer/status)" = 405
          kill "$NODE_PID"
      - name: Collect the files
        run: |
          echo "VERSION=$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" app/build.gradle)" >> "$GITHUB_ENV"
          mkdir -p out
          cp node/build/distributions/*.zip out/frostnode.zip
          sha256sum out/frostnode.zip
      - uses: actions/upload-artifact@v4
        with:
          name: frostnode-${{ github.sha }}
          path: out/frostnode.zip
      - name: Swap frostnode into the release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
             && git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE '^(app/|core/|gradle/|[^/]+\.gradle$|gradlew$|\.github/workflows/build\.yml$)'; then
            echo "This push also changes the app or the chain, so the Build workflow publishes frostnode with them."
            exit 0
          fi
          cd out
          gh release download "v$VERSION" --pattern SHA256SUMS --dir old
          grep -v '  frostnode\.zip$' old/SHA256SUMS > SHA256SUMS || true
          sha256sum frostnode.zip >> SHA256SUMS
          cat SHA256SUMS
          gh release upload "v$VERSION" frostnode.zip SHA256SUMS --clobber
          { echo "### frostnode for $VERSION"; echo '```'; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
