<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Not here | Qoin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23150e1a'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23ffb547'/%3E%3C/svg%3E">
<style>
@font-face { font-family: "Archivo"; src: url("/fonts/archivo.woff") format("woff");
  font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
@font-face { font-family: "Martian Mono"; src: url("/fonts/martian-mono.woff") format("woff");
  font-weight: 100 800; font-stretch: 75% 112.5%; font-display: swap; }
:root {
  --ground: #f5f0fa;
  --surface: #ffffff;
  --sunk: #ece3f4;
  --ink: #24142f;
  --muted: #65537a;
  --line: #dccfe8;
  --plum: #5e2c8c;
  --plum-ink: #ffffff;
  --lamp: #c9700a;
  --lamp-soft: rgba(232, 144, 28, 0.22);
  --lamp-glow: rgba(232, 144, 28, 0.45);
  --wave: #5e2c8c;
  --wave-fill: rgba(94, 44, 140, 0.12);
  --note: #fbf1e3;
  --note-ink: #5b3a06;
  --code: #1d1326;
  --code-ink: #efe6f7;
  --code-dim: #a897ba;
  --good: #23784a;
  --bad: #a3302b;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #150e1a;
    --surface: #20152a;
    --sunk: #1a1122;
    --ink: #f1eaf7;
    --muted: #b4a5c3;
    --line: #3a2a48;
    --plum: #cba6f7;
    --plum-ink: #1a0f22;
    --lamp: #ffb547;
    --lamp-soft: rgba(255, 181, 71, 0.18);
    --lamp-glow: rgba(255, 181, 71, 0.5);
    --wave: #cba6f7;
    --wave-fill: rgba(203, 166, 247, 0.14);
    --note: #2a1f1a;
    --note-ink: #f3e3c8;
    --code: #0f0914;
    --code-ink: #efe6f7;
    --code-dim: #9a89ad;
    --good: #6fd39b;
    --bad: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #150e1a;
  --surface: #20152a;
  --sunk: #1a1122;
  --ink: #f1eaf7;
  --muted: #b4a5c3;
  --line: #3a2a48;
  --plum: #cba6f7;
  --plum-ink: #1a0f22;
  --lamp: #ffb547;
  --lamp-soft: rgba(255, 181, 71, 0.18);
  --lamp-glow: rgba(255, 181, 71, 0.5);
  --wave: #cba6f7;
  --wave-fill: rgba(203, 166, 247, 0.14);
  --note: #2a1f1a;
  --note-ink: #f3e3c8;
  --code: #0f0914;
  --code-ink: #efe6f7;
  --code-dim: #9a89ad;
  --good: #6fd39b;
  --bad: #ff8a80;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 1.0625rem;
  line-height: 1.55;
  font-variation-settings: "wdth" 100;
  overflow-wrap: break-word;
}
a { color: var(--plum); text-underline-offset: 0.18em; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 3px solid var(--lamp); outline-offset: 3px; border-radius: 4px; }
.mono { font-family: "Martian Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
[hidden] { display: none !important; }

.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 20px; }

/* Header: the brand, then the four pages */
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px 18px; padding-block: 18px 6px; }
.brand { display: inline-flex; align-items: baseline; gap: 8px; color: var(--ink); text-decoration: none; font-weight: 800; font-size: 1.3rem; font-variation-settings: "wdth" 125; letter-spacing: -0.01em; }
.brand .tick { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.06em; color: var(--lamp); border: 1.5px solid currentColor; border-radius: 6px; padding: 1px 5px; }
.top nav { display: flex; flex-wrap: wrap; gap: 4px 18px; }
.top nav a { color: var(--muted); text-decoration: none; font-size: 0.97rem; white-space: nowrap; padding-block: 4px; border-bottom: 2px solid transparent; }
.top nav a:hover { color: var(--ink); }
.top nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--lamp); }

/* Page opener */
.opener { padding-block: 28px 8px; }
h1 {
  margin: 0;
  font-size: clamp(3.1rem, 15.5vw, 7rem);
  line-height: 0.92;
  font-weight: 800;
  font-variation-settings: "wdth" 125;
  letter-spacing: -0.015em;
  text-wrap: balance;
}
h1.long { font-size: clamp(2.6rem, 11.5vw, 5.6rem); }
.lede { margin: 18px 0 0; font-size: 1.2rem; line-height: 1.5; max-width: 34em; color: var(--ink); }
.cta { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px; margin-top: 26px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 52px; padding: 0 24px; border-radius: 12px;
  font: inherit; font-weight: 700; font-size: 1.05rem; text-decoration: none; cursor: pointer;
  border: 2px solid var(--plum); background: var(--plum); color: var(--plum-ink);
}
.btn:hover { filter: brightness(1.06); }
.btn.quiet { background: transparent; color: var(--plum); }
.btn.small { min-height: 40px; padding: 0 14px; font-size: 0.95rem; border-radius: 10px; }
.btn[disabled] { opacity: 0.5; cursor: default; filter: none; }
.fine { margin: 14px 0 0; color: var(--muted); font-size: 0.95rem; max-width: 36em; }

/* Sections */
section { padding-block: 44px 8px; }
h2 {
  margin: 0 0 10px;
  font-size: clamp(1.7rem, 5.4vw, 2.4rem);
  line-height: 1.08;
  font-weight: 750;
  font-variation-settings: "wdth" 112;
  letter-spacing: -0.01em;
  text-wrap: balance;
}
h3 { margin: 0 0 6px; font-size: 1.15rem; line-height: 1.3; font-weight: 700; }
.intro { margin: 0; max-width: 38em; color: var(--muted); }
p.body { max-width: 40em; }

/* Steps: a real sequence, so numbered */
.steps { list-style: none; counter-reset: step; margin: 24px 0 0; padding: 0; display: grid; gap: 22px; max-width: 44em; }
.steps li { counter-increment: step; display: grid; grid-template-columns: 2.4rem minmax(0, 1fr); gap: 0 14px; }
.steps li::before {
  content: counter(step); grid-row: span 3;
  font-family: "Martian Mono", ui-monospace, monospace; font-weight: 600; font-size: 1.3rem; line-height: 1.6rem;
  color: var(--lamp);
}
.steps b { font-size: 1.12rem; }
.steps span { color: var(--muted); }
.steps .mono { font-size: 0.86em; color: var(--ink); }

/* Facts: term on the left, detail on the right */
.facts { margin: 22px 0 0; display: grid; grid-template-columns: minmax(0, 1fr); max-width: 52em; }
.facts div { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; padding-block: 14px; border-top: 1px solid var(--line); }
.facts dt { color: var(--muted); font-size: 0.95rem; }
.facts dd { margin: 0; }
.facts .mono { font-size: 0.92em; }
.facts .nowrap { white-space: nowrap; }

/* Link cards to the other pages */
.cards { list-style: none; margin: 22px 0 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.cards a { display: block; height: 100%; padding: 18px 20px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; }
.cards a:hover { border-color: var(--plum); }
.cards b { display: block; font-size: 1.15rem; margin-bottom: 4px; }
.cards span { color: var(--muted); font-size: 0.97rem; }
.cards b::after { content: " →"; color: var(--lamp); }

/* Commands to copy: the button sits beside the code, so long lines scroll without running under it */
.cmd { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; margin: 14px 0 0; border-radius: 14px; background: var(--code); color: var(--code-ink); max-width: 52em; }
.cmd pre { margin: 0; padding: 16px 4px 16px 18px; overflow-x: auto; font-family: "Martian Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 0.82rem; line-height: 1.7; }
.cmd .c { color: var(--code-dim); }
.cmd button { margin: 10px 10px 0 6px; min-height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.08); color: var(--code-ink); font: inherit; font-size: 0.8rem; cursor: pointer; }
.cmd button:hover { background: rgba(255,255,255,0.16); }
p .mono, li > span .mono { font-size: 0.88em; }
code { font-family: "Martian Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 0.86em; background: var(--sunk); padding: 1px 6px; border-radius: 6px; overflow-wrap: anywhere; }

/* Tabs */
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0 0; }
.tabs button { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 2px solid var(--line); background: transparent; color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; }
.tabs button[aria-selected="true"] { border-color: var(--lamp); background: var(--lamp-soft); }
.panel { padding-top: 6px; }

/* Tables */
.table { margin: 22px 0 0; overflow-x: auto; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 0.97rem; }
th, td { text-align: left; vertical-align: top; padding: 12px 14px; border-top: 1px solid var(--line); }
thead th { border-top: 0; font-size: 0.9rem; color: var(--muted); font-weight: 600; background: var(--sunk); }
tbody th { font-weight: 600; color: var(--muted); width: 20%; }
td .mono { font-size: 0.9em; }

.note { margin: 14px 0 0; padding: 12px 16px; border-radius: 12px; background: var(--note); color: var(--note-ink); max-width: 44em; }
.print { color: var(--muted); max-width: 46em; }
footer { margin-top: 48px; padding-block: 22px 40px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 0.95rem; }
footer a { color: var(--muted); }

@media (min-width: 760px) {
  .facts div { grid-template-columns: 14em minmax(0, 1fr); gap: 24px; }
  .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .cards.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>
</head>

</div>
</body>
